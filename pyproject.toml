[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox-manager"
version = "0.1.0"
description = "Deterministic restricted declarative sandboxes"
requires-python = ">=3.10"

[project.scripts]
asm = "agent_sandbox_manager.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
